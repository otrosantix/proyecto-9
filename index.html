<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip UI</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <nav class="navegacion-principal">
    <ul class="lista-navegacion">
      <li class="elemento-navegacion">
        <a class="enlace-navegacion" href="#">Inicio</a>
        <span class="tooltip-navegacion tooltip-aparecer">Volver al comienzo</span>
      </li>
      <li class="elemento-navegacion">
        <a class="enlace-navegacion" href="#">Proyectos</a>
        <span class="tooltip-navegacion tooltip-deslizar">Aquí está todo lo que he construido</span>
      </li>
      <li class="elemento-navegacion">
        <a class="enlace-navegacion" href="#">Blog</a>
        <span class="tooltip-navegacion tooltip-escalar">Lee mis últimos artículos</span>
      </li>
    </ul>
  </nav>
</body>
</html>
